services:
  - type: web
    name: neighbors-in-the-loop
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DB_PATH
        value: /app/data/nm-app.db
    disk:
      name: nm-app-data
      mountPath: /app/data
      sizeGB: 1
